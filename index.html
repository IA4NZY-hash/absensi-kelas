<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Absensi Modern</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      --hadir-bg: #05d892;
      --telat-bg: #ffae00;
      --izin-bg: #002ec7;
      --dispensasi-bg: #6f47cc;
      --sakit-bg: #ef4444;
      --alpa-bg: #333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .header-title { text-align: center; margin-bottom: 24px; }
    .header-title h2 { font-size: 24px; font-weight: 700; color: var(--text-main); }
    .header-title p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    .admin-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f5f9;
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      color: var(--text-main);
      background-color: #f8fafc;
      transition: all 0.2s ease;
      outline: none;
    }

    input:read-only {
      background-color: #e2e8f0;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
      margin-bottom: 32px;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .btn-fingerprint { background-color: #0f172a; color: white; font-size: 15px; }
    .btn-manual-siswa { background-color: var(--primary); color: white; font-size: 15px; }
    .btn-submit { background-color: var(--primary); color: white; }

    .btn-admin-toggle {
      background: transparent;
      color: var(--primary);
      padding: 6px 12px;
      font-size: 12px;
      border: 1px solid var(--primary);
    }

    .btn-export { background-color: #10b981; color: white; padding: 8px 12px; font-size: 13px; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .summary-card span { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .summary-card strong { font-size: 18px; color: var(--text-main); }

    .rekap-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-box { display: flex; align-items: center; gap: 8px; }
    .filter-box input { padding: 6px 10px; width: auto; }

    .table-responsive { overflow-x: auto; border-radius: 12px; border: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; background: white; }
    th { background-color: #f8fafc; color: var(--text-muted); font-weight: 600; font-size: 12px; padding: 12px 16px; text-align: left; }
    td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; }

    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; color: white; }
    .badge-hadir { background-color: var(--hadir-bg); }
    .badge-telat { background-color: var(--telat-bg); }
    .badge-izin { background-color: var(--izin-bg); }
    .badge-dispensasi { background-color: var(--dispensasi-bg); }
    .badge-sakit { background-color: var(--sakit-bg); }
    .badge-alpa { background-color: var(--alpa-bg); }

    .hidden { display: none !important; }

    .login-wrapper {
      max-width: 400px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <!-- ================= HALAMAN LOGIN ================= -->

      <p>Kunci Akun Siswa di Perangkat Ini</p>

  <!-- ================= TAMPILAN UTAMA ABSEN ================= -->

    <div class="header-title">
      <h2>Presensi Sekolah</h2>
      <p>Sistem Presensi Realtime Database</p>
    </div>

    <div class="admin-bar">

    </div>

    <!-- PANEL ABSEN SISWA -->
    <div id="siswaSection">
      <div class="form-group">
        <label for="noAbsenSiswa">Nomor Absen</label>
        <input type="number" id="noAbsenSiswa" readonly>
      </div>

      <div class="form-group">
        <label for="namaSiswa">Nama Lengkap</label>
        <input type="text" id="namaSiswa" readonly>
      </div>

      <div class="btn-group">

        <button type="button" class="btn-fingerprint" id="btnFingerprint">Absen Fingerprint</button>

    </div>

    <!-- PANEL INPUT ADMIN -->

        <label for="noAbsenAdmin">Nomor Absen Siswa</label>
        <input type="number" id="noAbsenAdmin" placeholder="Ketik No. Absen">
      </div>

      <div class="form-group">
        <label for="namaAdmin">Nama Lengkap</label>
        <input type="text" id="namaAdmin" placeholder="Otomatis terisi" readonly>
      </div>

      <div class="form-group">
        <label for="statusAdmin">Keterangan Status</label>
        <select id="statusAdmin">

          <option value="Izin">Izin</option>
          <option value="Dispensasi">Dispensasi</option>
          <option value="Sakit">Sakit</option>
          <option value="Alpa">Alpa</option>
        </select>
      </div>

      <div class="btn-group">

    </form>

    <hr style="margin: 24px 0; border: none; border-top: 1px solid #e2e8f0;">

    <div class="rekap-header">
      <h3>Rekap Absensi Harian</h3>
      <div class="filter-box">
        <input type="date" id="filterDate">
        <button type="button" class="btn-export hidden" id="btnExport">Export Excel (CSV)</button>

    </div>

    <div class="summary-grid">

      <div class="summary-card"><span>Izin</span><strong id="countIzin">0</strong></div>
      <div class="summary-card"><span>Sakit</span><strong id="countSakit">0</strong></div>
      <div class="summary-card"><span>Dispen</span><strong id="countDispen">0</strong></div>

    };

    let isAdmin = false;
    let loggedInSiswa = null;
    let attendanceData = [];

    const loginScreen = document.getElementById('loginScreen');
    const mainScreen = document.getElementById('mainScreen');
    const loginNoAbsen = document.getElementById('loginNoAbsen');
    const loginPin = document.getElementById('loginPin');
    const btnLoginSiswaSubmit = document.getElementById('btnLoginSiswaSubmit');

    const siswaSection = document.getElementById('siswaSection');
    const inputNoAbsenSiswa = document.getElementById('noAbsenSiswa');
    const inputNamaSiswa = document.getElementById('namaSiswa');
    const btnManualSiswa = document.getElementById('btnManualSiswa');
    const btnFingerprint = document.getElementById('btnFingerprint');

    const adminForm = document.getElementById('adminManualForm');
    const inputNoAbsenAdmin = document.getElementById('noAbsenAdmin');
    const inputNamaAdmin = document.getElementById('namaAdmin');
    const selectStatusAdmin = document.getElementById('statusAdmin');

    const tableBody = document.getElementById('attendanceTable');
    const btnToggleAdmin = document.getElementById('btnToggleAdmin');
    const btnLogoutAdmin = document.getElementById('btnLogoutAdmin');
    const roleLabel = document.getElementById('roleLabel');
    const filterDateInput = document.getElementById('filterDate');
    const btnExport = document.getElementById('btnExport');

    const todayStr = new Date().toISOString().split('T')[0];
    filterDateInput.value = todayStr;

    // OTOMATIS MASUK JIKA PERANGKAT SUDAH TERIKAT AKUN SISWA
    function checkDeviceLock() {
      const savedUser = localStorage.getItem('lockedStudent');
      if (savedUser) {
        loggedInSiswa = JSON.parse(savedUser);
        inputNoAbsenSiswa.value = loggedInSiswa.noAbsen;
        inputNamaSiswa.value = loggedInSiswa.nama;
        roleLabel.innerText = `Mode Siswa: ${loggedInSiswa.nama}`;

        loginScreen.classList.add('hidden');
        mainScreen.classList.remove('hidden');
      }
    }
    checkDeviceLock();

    // PROSES LOGIN SISWA PERTAMA KALI
    btnLoginSiswaSubmit.addEventListener('click', function() {
      const no = loginNoAbsen.value.trim();
      const pin = loginPin.value.trim();

      if (!studentDatabase[no]) {
        alert("Nomor absen tidak ditemukan!");

      if (studentDatabase[no].pin !== pin) {
        alert("PIN Salah!");
        return;

      localStorage.setItem('lockedStudent', JSON.stringify(userObj));
      loggedInSiswa = userObj;

      inputNamaSiswa.value = loggedInSiswa.nama;

    btnToggleAdmin.addEventListener('click', function() {

        isAdmin = true;
        roleLabel.innerText = "Mode: Absensi Kelas";
        siswaSection.classList.add('hidden');
        adminForm.classList.remove('hidden');
        btnExport.classList.remove('hidden');
        btnToggleAdmin.classList.add('hidden');
        btnLogoutAdmin.classList.remove('hidden');
        alert("Login Admin Berhasil!");
      } else if (pin !== null) {
        alert("PIN Salah!");
      }
    });

    // KELUAR MODE ADMIN
    btnLogoutAdmin.addEventListener('click', function() {
      isAdmin = false;
      adminForm.classList.add('hidden');
      btnExport.classList.add('hidden');
      btnLogoutAdmin.classList.add('hidden');
      btnToggleAdmin.classList.remove('hidden');

      if (loggedInSiswa) {
        roleLabel.innerText = `Mode Siswa: ${loggedInSiswa.nama}`;
        siswaSection.classList.remove('hidden');
      } else {
        mainScreen.classList.add('hidden');
        loginScreen.classList.remove('hidden');
      }
    });

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return R * c;
    }

    inputNoAbsenAdmin.addEventListener('input', function() {
      const val = this.value.trim();
      inputNamaAdmin.value = studentDatabase[val] ? studentDatabase[val].nama : '';
    });

    onValue(absensiRef, (snapshot) => {
      const data = snapshot.val();
      attendanceData = [];
      if (data) {
        Object.keys(data).forEach(key => {
          attendanceData.push(data[key]);
        });
      }
      renderTable();
    });

    function getISODateString(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function sudahAbsenHariIni(noAbsen) {
      const today = getISODateString(new Date());
      return attendanceData.some(item => {
        const itemDate = getISODateString(new Date(item.timestamp || item.rawDate));
        return itemDate === today && String(item.noAbsen) === String(noAbsen);
      });
    }

    function renderTable() {
      tableBody.innerHTML = '';
      const selectedDate = filterDateInput.value;

      const filteredData = attendanceData.filter(item => {
        const itemDate = getISODateString(new Date(item.timestamp || item.rawDate));
        return itemDate === selectedDate;
      });

      let counts = { Hadir: 0, Telat: 0, Izin: 0, Sakit: 0, Dispensasi: 0, Alpa: 0 };

      if (filteredData.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8; padding: 24px;">Tidak ada data presensi pada tanggal ini.</td></tr>`;
      } else {
        filteredData.forEach((item, index) => {
          if (counts[item.status] !== undefined) {
            counts[item.status]++;
          }

          const row = document.createElement('tr');
          let badgeClass = 'badge-hadir';
          if (item.status === 'Telat') badgeClass = 'badge-telat';
          if (item.status === 'Izin') badgeClass = 'badge-izin';
          if (item.status === 'Dispensasi') badgeClass = 'badge-dispensasi';
          if (item.status === 'Sakit') badgeClass = 'badge-sakit';
          if (item.status === 'Alpa') badgeClass = 'badge-alpa';

          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${item.waktu}</td>
            <td><b>${item.noAbsen}</b></td>
            <td>${item.nama}</td>
            <td><span class="badge ${badgeClass}">${item.status}</span></td>
          `;
          tableBody.appendChild(row);
        });
      }

      document.getElementById('countHadir').innerText = counts.Hadir;
      document.getElementById('countTelat').innerText = counts.Telat;
      document.getElementById('countIzin').innerText = counts.Izin;
      document.getElementById('countSakit').innerText = counts.Sakit;
      document.getElementById('countDispen').innerText = counts.Dispensasi;
      document.getElementById('countAlpa').innerText = counts.Alpa;
    }

    filterDateInput.addEventListener('change', renderTable);

    function simpanAbsen(noAbsen, nama, statusPilihan) {
      if (sudahAbsenHariIni(noAbsen)) {
        alert(`Gagal! Nomor Absen ${noAbsen} (${nama}) sudah melakukan absensi hari ini.`);
        return;
      }

      const now = new Date();
      const waktuFormat = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      let statusAkhir = statusPilihan;

      if (statusPilihan === 'Hadir') {
        const jam = now.getHours();
        const menit = now.getMinutes();
        if (jam > 6 || (jam === 6 && menit > 30)) {
          statusAkhir = 'Telat';
        }
      }

      const newRecord = { 
        waktu: waktuFormat, 
        noAbsen, 
        nama, 
        status: statusAkhir,
        timestamp: now.getTime(),
        rawDate: now.toString()
      };

      push(absensiRef, newRecord)
        .then(() => {
          filterDateInput.value = getISODateString(now);
          if(adminForm) adminForm.reset();
        })
        .catch((err) => {
          alert("Gagal menyimpan data: " + err.message);
        });
    }

    // 1. ABSEN MANUAL SISWA
    btnManualSiswa.addEventListener('click', function() {
      if (!loggedInSiswa) return;
      const noAbsen = loggedInSiswa.noAbsen;
      const nama = loggedInSiswa.nama;

      if (sudahAbsenHariIni(noAbsen)) {
        alert(`Nomor Absen ${noAbsen} (${nama}) sudah melakukan absensi hari ini!`);
        return;
      }

      if (!navigator.geolocation) {
        alert('GPS Perangkat tidak didukung!');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          const distance = calculateDistance(userLat, userLng, SCHOOL_LAT, SCHOOL_LNG);

          if (distance > MAX_RADIUS_METERS && !isAdmin) {
            alert(`Di luar area sekolah! Jarak Anda: ${Math.round(distance)} meter dari sekolah.`);
            return;
          }

          simpanAbsen(noAbsen, nama, 'Hadir');
          alert(`Absensi Manual Berhasil untuk ${nama}!`);
        },
        (error) => {
          alert('Gagal mengambil lokasi GPS. Aktifkan Izin Lokasi di browser!');
        },
        { enableHighAccuracy: true }
      );
    });

    // 2. ABSEN FINGERPRINT SISWA
    btnFingerprint.addEventListener('click', function() {
      if (!loggedInSiswa) return;

      if (!navigator.geolocation) {
        alert('GPS Perangkat tidak didukung!');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          const distance = calculateDistance(userLat, userLng, SCHOOL_LAT, SCHOOL_LNG);

          if (distance > MAX_RADIUS_METERS && !isAdmin) {
            alert(`Di luar area sekolah! Jarak Anda: ${Math.round(distance)} meter.`);
            return;
          }

          if (!window.PublicKeyCredential) {
            alert('Perangkat tidak mendukung Fingerprint!');
            return;
          }

          if (sudahAbsenHariIni(loggedInSiswa.noAbsen)) {
            alert(`Nomor Absen ${loggedInSiswa.noAbsen} (${loggedInSiswa.nama}) sudah melakukan absensi hari ini!`);
            return;
          }

          try {
            const credential = await navigator.credentials.create({
              publicKey: {
                challenge: new Uint8Array([1, 2, 3, 4]),
                rp: { name: "Absensi Sekolah" },
                user: { id: new Uint8Array([1, 2, 3, 4]), name: loggedInSiswa.nama, displayName: loggedInSiswa.nama },
                pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                timeout: 60000,
                authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }
              }
            });

            if (credential) {
              simpanAbsen(loggedInSiswa.noAbsen, loggedInSiswa.nama, 'Hadir');
              alert(`Absensi Fingerprint Berhasil! (${loggedInSiswa.nama})`);
            }
          } catch (err) {
            alert('Autentikasi fingerprint dibatalkan.');
          }
        },
        (error) => {
          alert('Gagal mengambil lokasi GPS. Aktifkan Izin Lokasi!');
        },
        { enableHighAccuracy: true }
      );
    });

    // 3. INPUT MANUAL ADMIN
    adminForm.addEventListener('submit', function(e) {
      e.preventDefault();
      if (!isAdmin) return;

      const noAbsen = inputNoAbsenAdmin.value.trim();
      const nama = inputNamaAdmin.value.trim();
      const status = selectStatusAdmin.value;

      if (!noAbsen || !nama) {
        alert('Isi Nomor Absen dan Nama!');
        return;
      }

      if (sudahAbsenHariIni(noAbsen)) {
        alert(`Nomor Absen ${noAbsen} (${nama}) sudah terdata pada hari ini!`);
        return;
      }

      simpanAbsen(noAbsen, nama, status);
      alert('Data berhasil disimpan oleh Admin!');
    });

    // 4. EXPORT CSV
    btnExport.addEventListener('click', function() {
      if (!isAdmin) {
        alert("Akses Ditolak!");
        return;
      }

      const selectedDate = filterDateInput.value;
      const filteredData = attendanceData.filter(item => {
        const itemDate = getISODateString(new Date(item.timestamp || item.rawDate));
        return itemDate === selectedDate;
      });

      if (filteredData.length === 0) {
        alert("Tidak ada data untuk diexport pada tanggal ini!");
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,No,Jam,No Absen,Nama,Status\n";
      filteredData.forEach((item, index) => {
        csvContent += `${index + 1},${item.waktu},${item.noAbsen},${item.nama},${item.status}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Rekap_Absen_${selectedDate}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
