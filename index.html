<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Absensi Modern</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      --hadir-bg: #10b981;
      --telat-bg: #f5130b;
      --izin-bg: #f5d20b;
      --dispensasi-bg: #8b5cf6;
      --sakit-bg: #fc892c;
      --alpa-bg: #333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .header-title { text-align: center; margin-bottom: 24px; }
    .header-title h2 { font-size: 24px; font-weight: 700; color: var(--text-main); }
    .header-title p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    .admin-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f5f9;
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      color: var(--text-main);
      background-color: #f8fafc;
      transition: all 0.2s ease;
      outline: none;
    }

    input:read-only {
      background-color: #e2e8f0;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
      margin-bottom: 32px;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .btn-fingerprint {
      background-color: #0f172a;
      color: white;
      font-size: 15px;
    }

    .btn-manual-siswa {
      background-color: var(--primary);
      color: white;
      font-size: 15px;
    }

    .btn-submit {
      background-color: var(--primary);
      color: white;
    }

    .btn-admin-toggle {
      background: transparent;
      color: var(--primary);
      padding: 6px 12px;
      font-size: 12px;
      border: 1px solid var(--primary);
    }

    .btn-export {
      background-color: #10b981;
      color: white;
      padding: 8px 12px;
      font-size: 13px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .summary-card span {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .summary-card strong {
      font-size: 18px;
      color: var(--text-main);
    }

    .rekap-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-box input {
      padding: 6px 10px;
      width: auto;
    }

    .table-responsive { overflow-x: auto; border-radius: 12px; border: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; background: white; }
    th { background-color: #f8fafc; color: var(--text-muted); font-weight: 600; font-size: 12px; padding: 12px 16px; text-align: left; }
    td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; }

    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; color: white; }
    .badge-hadir { background-color: var(--hadir-bg); }
    .badge-telat { background-color: var(--telat-bg); }
    .badge-izin { background-color: var(--izin-bg); }
    .badge-dispensasi { background-color: var(--dispensasi-bg); }
    .badge-sakit { background-color: var(--sakit-bg); }
    .badge-alpa { background-color: var(--alpa-bg); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-title">
      <h2>Presensi Sekolah</h2>
      <p>Sistem Presensi Realtime Database</p>
    </div>

    <!-- Admin Control Bar -->
    <div class="admin-bar">
      <span id="roleLabel" style="font-weight: 600; font-size: 13px;">Mode: Siswa</span>
      <button type="button" class="btn-admin-toggle" id="btnToggleAdmin">Login Admin</button>
    </div>

    <!-- TAMPILAN UTAMA ABSEN SISWA -->
    <div id="siswaSection">
      <div class="form-group">
        <label for="noAbsenSiswa">Nomor Absen</label>
        <input type="number" id="noAbsenSiswa" placeholder="Masukkan No. Absen Kamu">
      </div>

      <div class="form-group">
        <label for="namaSiswa">Nama Lengkap</label>
        <input type="text" id="namaSiswa" placeholder="Otomatis terisi via No. Absen" readonly>
      </div>

      <div class="btn-group">
        <button type="button" class="btn-manual-siswa" id="btnManualSiswa">Absen Manual</button>
        <button type="button" class="btn-fingerprint" id="btnFingerprint">Absen Fingerprint</button>
      </div>
    </div>

    <!-- FORM INPUT ADMIN (HANYA MUNCUL KETIKA ADMIN LOGIN) -->
    <form id="adminManualForm" class="hidden">
      <div style="background: #e0e7ff; padding: 12px; border-radius: 12px; margin-bottom: 16px; font-size: 13px; color: #3730a3; font-weight: 600;">
        Panel Input Status Admin (Izin / Sakit / Dispen / Alpa)
      </div>

      <div class="form-group">
        <label for="noAbsenAdmin">Nomor Absen Siswa</label>
        <input type="number" id="noAbsenAdmin" placeholder="Ketik No. Absen">
      </div>

      <div class="form-group">
        <label for="namaAdmin">Nama Lengkap</label>
        <input type="text" id="namaAdmin" placeholder="Otomatis terisi">
      </div>

      <div class="form-group">
        <label for="statusAdmin">Keterangan Status</label>
        <select id="statusAdmin">
          <option value="Hadir">Hadir</option>
          <option value="Izin">Izin</option>
          <option value="Dispensasi">Dispensasi</option>
          <option value="Sakit">Sakit</option>
          <option value="Alpa">Alpa</option>
        </select>
      </div>

      <div class="btn-group">
        <button type="submit" class="btn-submit">Simpan Absen via Admin</button>
      </div>
    </form>

    <hr style="margin: 24px 0; border: none; border-top: 1px solid #e2e8f0;">

    <!-- SECTION REKAP ABSEN PER HARI -->
    <div class="rekap-header">
      <h3>Rekap Absensi Harian</h3>
      <div class="filter-box">
        <input type="date" id="filterDate">
        <button type="button" class="btn-export hidden" id="btnExport">Export Excel (CSV)</button>
      </div>
    </div>

    <!-- Ringkasan Stat Count -->
    <div class="summary-grid">
      <div class="summary-card"><span>Hadir</span><strong id="countHadir">0</strong></div>
      <div class="summary-card"><span>Telat</span><strong id="countTelat">0</strong></div>
      <div class="summary-card"><span>Izin</span><strong id="countIzin">0</strong></div>
      <div class="summary-card"><span>Sakit</span><strong id="countSakit">0</strong></div>
      <div class="summary-card"><span>Dispen</span><strong id="countDispen">0</strong></div>
      <div class="summary-card"><span>Alpa</span><strong id="countAlpa">0</strong></div>
    </div>

    <!-- Tabel Data Rekap Harian -->
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Waktu</th>
            <th>No. Absen</th>
            <th>Nama</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="attendanceTable"></tbody>
      </table>
    </div>
  </div>

  <!-- FIREBASE SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDO-RpsbA8-ov-Ud66mgu2DTmaPsKlXgnc",
      authDomain: "absensi-kelas-14804.firebaseapp.com",
      databaseURL: "https://absensi-kelas-14804-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "absensi-kelas-14804",
      storageBucket: "absensi-kelas-14804.firebasestorage.app",
      messagingSenderId: "751554502276",
      appId: "1:751554502276:web:94433b99f59b6d583d2cd1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const absensiRef = ref(db, 'absensi');

    const ADMIN_PIN = "1234";
    const SCHOOL_LAT = -6.890391; 
    const SCHOOL_LNG = 107.558687; 
    const MAX_RADIUS_METERS = 100; 

    const studentDatabase = {
      "1": "ABDILAH ISMAIL",
      "2": "ABDULLAH AZZAMUL AKRAM",
      "3": "ALDYANSYAH GEMA GUMILAR",
      "4": "ADZANI AHSAN AL FARUQ",
      "5": "ADZRA AQILAH HUSNA",
      "6": "AKHDAN JABBAR RAHADIKA",
      "7": "ALDY RAMADHAN",
      "8": "ALFIN SAMUEL",
      "9": "ALIF AHMAD ALFARABI",
      "10": "ALTHAFUL MUHAMMAD ZIYAD",
      "11": "ALYA NAYSHILLA ZALIANTY",
      "12": "CANDRA MUHAMMAD RIZKI",
      "13": "FABIAN SAKHII HAIDAR",
      "14": "FADIL FADILAH",
      "15": "FAHRI TRI TANDIAN PRAYOGA",
      "16": "HAIDAR SYAFIQ ZAIN",
      "17": "KHANSA PUTRI LATIFAH",
      "18": "KYANDRA HAMZIQ HAMIZAN",
      "19": "MOCHAMAD RIDWANNUDIN",
      "20": "MOHAMAD YUSRA MAHDAN",
      "21": "MUHAMAD RAISA PRAYOGA",
      "22": "MUHAMMAD FINZA SAMIR QOLBI",
      "23": "MUHAMMAD IRFAN",
      "24": "MUHAMMAD NASER SYARIF GOZALI",
      "25": "MUHAMMAD RAHLIL IBRAHIM",
      "26": "MUHAMMAD RAIHAN ARKAN RAHAYU",
      "27": "MUHAMMAD RIZKY NASRUDIN",
      "28": "MU'TASHIM VEDA ARTHAGUNG",
      "29": "NAZHILA ANDHINI",
      "30": "PRIYANKA ARSYA SAFIERA",
      "31": "RADITYA PRATAMA",
      "32": "RAFI SUPRIYADI",
      "33": "RASYA OKTAVIAN AL HABBSYI",
      "34": "REYVAN RIZQI RIVALDI",
      "35": "RIGA HENDRI SUWARA",
      "36": "RIZQI MAULANA",
      "37": "RIZQI MISHARY RASHID",
      "38": "SAFA KHAIRUNISA",
      "39": "SITI NURSYAHIDAH",
      "40": "SYAHRIL AHMAD WIJAYA",
      "41": "VICKY IZAQI ALMUWARIZKI"
    };

    let isAdmin = false;
    let attendanceData = [];

    const inputNoAbsenSiswa = document.getElementById('noAbsenSiswa');
    const inputNamaSiswa = document.getElementById('namaSiswa');
    const btnManualSiswa = document.getElementById('btnManualSiswa');
    const btnFingerprint = document.getElementById('btnFingerprint');

    const adminForm = document.getElementById('adminManualForm');
    const inputNoAbsenAdmin = document.getElementById('noAbsenAdmin');
    const inputNamaAdmin = document.getElementById('namaAdmin');
    const selectStatusAdmin = document.getElementById('statusAdmin');

    const tableBody = document.getElementById('attendanceTable');
    const btnToggleAdmin = document.getElementById('btnToggleAdmin');
    const roleLabel = document.getElementById('roleLabel');
    const filterDateInput = document.getElementById('filterDate');
    const btnExport = document.getElementById('btnExport');

    const todayStr = new Date().toISOString().split('T')[0];
    filterDateInput.value = todayStr;

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return R * c;
    }

    // Auto Fill Nama Siswa di Form Siswa
    inputNoAbsenSiswa.addEventListener('input', function() {
      const val = this.value.trim();
      inputNamaSiswa.value = studentDatabase[val] || '';
    });

    // Auto Fill Nama Siswa di Form Admin
    inputNoAbsenAdmin.addEventListener('input', function() {
      const val = this.value.trim();
      inputNamaAdmin.value = studentDatabase[val] || '';
    });

    // Realtime Database Listener
    onValue(absensiRef, (snapshot) => {
      const data = snapshot.val();
      attendanceData = [];
      if (data) {
        Object.keys(data).forEach(key => {
          attendanceData.push(data[key]);
        });
      }
      renderTable();
    });

    // Toggle Login Admin
    btnToggleAdmin.addEventListener('click', function() {
      if (!isAdmin) {
        const pin = prompt("Masukkan PIN Admin Sekolah:");
        if (pin === ADMIN_PIN) {
          isAdmin = true;
          roleLabel.innerText = "Mode: Admin Kelas";
          btnToggleAdmin.innerText = "Logout Admin";
          adminForm.classList.remove('hidden');
          btnExport.classList.remove('hidden');
          alert("Login Admin Berhasil!");
        } else if (pin !== null) {
          alert("PIN Salah!");
        }
      } else {
        isAdmin = false;
        roleLabel.innerText = "Mode: Siswa";
        btnToggleAdmin.innerText = "Login Admin";
        adminForm.classList.add('hidden');
        btnExport.classList.add('hidden');
      }
    });

    function getISODateString(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function renderTable() {
      tableBody.innerHTML = '';
      const selectedDate = filterDateInput.value;

      const filteredData = attendanceData.filter(item => {
        const itemDate = getISODateString(new Date(item.timestamp || item.rawDate));
        return itemDate === selectedDate;
      });

      let counts = { Hadir: 0, Telat: 0, Izin: 0, Sakit: 0, Dispensasi: 0, Alpa: 0 };

      if (filteredData.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8; padding: 24px;">Tidak ada data presensi pada tanggal ini.</td></tr>`;
      } else {
        filteredData.forEach((item, index) => {
          if (counts[item.status] !== undefined) {
            counts[item.status]++;
          }

          const row = document.createElement('tr');
          let badgeClass = 'badge-hadir';
          if (item.status === 'Telat') badgeClass = 'badge-telat';
          if (item.status === 'Izin') badgeClass = 'badge-izin';
          if (item.status === 'Dispensasi') badgeClass = 'badge-dispensasi';
          if (item.status === 'Sakit') badgeClass = 'badge-sakit';
          if (item.status === 'Alpa') badgeClass = 'badge-alpa';

          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${item.waktu}</td>
            <td><b>${item.noAbsen}</b></td>
            <td>${item.nama}</td>
            <td><span class="badge ${badgeClass}">${item.status}</span></td>
          `;
          tableBody.appendChild(row);
        });
      }

      document.getElementById('countHadir').innerText = counts.Hadir;
      document.getElementById('countTelat').innerText = counts.Telat;
      document.getElementById('countIzin').innerText = counts.Izin;
      document.getElementById('countSakit').innerText = counts.Sakit;
      document.getElementById('countDispen').innerText = counts.Dispensasi;
      document.getElementById('countAlpa').innerText = counts.Alpa;
    }

    filterDateInput.addEventListener('change', renderTable);

    function simpanAbsen(noAbsen, nama, statusPilihan) {
      const now = new Date();
      const waktuFormat = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      let statusAkhir = statusPilihan;

      // Batas Jam Absen (06:30)
      if (statusPilihan === 'Hadir') {
        const jam = now.getHours();
        const menit = now.getMinutes();
        if (jam > 6 || (jam === 6 && menit > 30)) {
          statusAkhir = 'Telat';
        }
      }

      const newRecord = { 
        waktu: waktuFormat, 
        noAbsen, 
        nama, 
        status: statusAkhir,
        timestamp: now.getTime(),
        rawDate: now.toString()
      };

      push(absensiRef, newRecord)
        .then(() => {
          filterDateInput.value = getISODateString(now);
          inputNoAbsenSiswa.value = '';
          inputNamaSiswa.value = '';
          if(adminForm) adminForm.reset();
        })
        .catch((err) => {
          alert("Gagal menyimpan data: " + err.message);
        });
    }

    // 1. ABSEN MANUAL SISWA (Wajib GPS & Kunci Status 'Hadir')
    btnManualSiswa.addEventListener('click', function() {
      const noAbsen = inputNoAbsenSiswa.value.trim();
      const nama = inputNamaSiswa.value.trim();

      if (!noAbsen || !nama) {
        alert('Masukkan Nomor Absen yang valid!');
        return;
      }

      if (!navigator.geolocation) {
        alert('GPS Perangkat tidak didukung!');
        return;
      }

      // Cek Koordinat GPS
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          const distance = calculateDistance(userLat, userLng, SCHOOL_LAT, SCHOOL_LNG);

          if (distance > MAX_RADIUS_METERS && !isAdmin) {
            alert(`Di luar area sekolah! Jarak Anda: ${Math.round(distance)} meter dari sekolah.`);
            return;
          }

          // Simpan dengan status otomatis "Hadir"
          simpanAbsen(noAbsen, nama, 'Hadir');
          alert(`Absensi Manual Berhasil untuk ${nama}!`);
        },
        (error) => {
          alert('Gagal mengambil lokasi GPS. Aktifkan Izin Lokasi di browser!');
        },
        { enableHighAccuracy: true }
      );
    });

    // 2. ABSEN FINGERPRINT SISWA (Wajib GPS & Kunci Status 'Hadir')
    btnFingerprint.addEventListener('click', function() {
      if (!navigator.geolocation) {
        alert('GPS Perangkat tidak didukung!');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          const distance = calculateDistance(userLat, userLng, SCHOOL_LAT, SCHOOL_LNG);

          if (distance > MAX_RADIUS_METERS && !isAdmin) {
            alert(`Di luar area sekolah! Jarak Anda: ${Math.round(distance)} meter.`);
            return;
          }

          if (!window.PublicKeyCredential) {
            alert('Perangkat tidak mendukung Fingerprint!');
            return;
          }

          const savedUser = JSON.parse(localStorage.getItem('fingerprintUser'));

          if (savedUser) {
            try {
              const assertion = await navigator.credentials.get({
                publicKey: { challenge: new Uint8Array([1, 2, 3, 4]), timeout: 60000, userVerification: "required" }
              });

              if (assertion) {
                simpanAbsen(savedUser.noAbsen, savedUser.nama, 'Hadir');
                alert(`Absensi Fingerprint Berhasil! (${savedUser.nama})`);
              }
            } catch (err) {
              alert('Autentikasi fingerprint dibatalkan.');
            }
          } else {
            const noAbsen = prompt("Pendaftaran Awal Fingerprint: Masukkan Nomor Absen:");
            if (!noAbsen || !studentDatabase[noAbsen]) {
              alert("Nomor Absen tidak ditemukan!");
              return;
            }
            const nama = studentDatabase[noAbsen];

            try {
              const credential = await navigator.credentials.create({
                publicKey: {
                  challenge: new Uint8Array([1, 2, 3, 4]),
                  rp: { name: "Absensi Sekolah" },
                  user: { id: new Uint8Array([1, 2, 3, 4]), name: nama, displayName: nama },
                  pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                  timeout: 60000,
                  authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }
                }
              });

              if (credential) {
                localStorage.setItem('fingerprintUser', JSON.stringify({ noAbsen, nama }));
                simpanAbsen(noAbsen, nama, 'Hadir');
                alert(`Pendaftaran & Absensi Berhasil!`);
              }
            } catch (err) {
              alert('Pendaftaran fingerprint gagal.');
            }
          }
        },
        (error) => {
          alert('Gagal mengambil lokasi GPS. Aktifkan Izin Lokasi!');
        },
        { enableHighAccuracy: true }
      );
    });

    // 3. INPUT MANUAL ADMIN (Bisa pilih Izin/Sakit/Dispen/Alpa)
    adminForm.addEventListener('submit', function(e) {
      e.preventDefault();
      if (!isAdmin) return;

      const noAbsen = inputNoAbsenAdmin.value.trim();
      const nama = inputNamaAdmin.value.trim();
      const status = selectStatusAdmin.value;

      if (!noAbsen || !nama) {
        alert('Isi Nomor Absen dan Nama!');
        return;
      }

      simpanAbsen(noAbsen, nama, status);
      alert('Data berhasil disimpan oleh Admin!');
    });

    // 4. EXPORT CSV (Khusus Admin)
    btnExport.addEventListener('click', function() {
      if (!isAdmin) {
        alert("Akses Ditolak!");
        return;
      }

      const selectedDate = filterDateInput.value;
      const filteredData = attendanceData.filter(item => {
        const itemDate = getISODateString(new Date(item.timestamp || item.rawDate));
        return itemDate === selectedDate;
      });

      if (filteredData.length === 0) {
        alert("Tidak ada data untuk diexport pada tanggal ini!");
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,No,Jam,No Absen,Nama,Status\n";
      filteredData.forEach((item, index) => {
        csvContent += `${index + 1},${item.waktu},${item.noAbsen},${item.nama},${item.status}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Rekap_Absen_${selectedDate}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
