<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Absensi Modern</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      --hadir-bg: #10b981;
      --telat-bg: #be123c;
      --izin-bg: #f59e0b;
      --dispensasi-bg: #8b5cf6;
      --sakit-bg: #ef4444;
      --alpa-bg: #333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .header-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-title h2 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .header-title p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      color: var(--text-main);
      background-color: #f8fafc;
      transition: all 0.2s ease;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .btn-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 24px;
      margin-bottom: 32px;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-submit {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-fingerprint {
      background-color: #0f172a;
      color: white;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }

    .btn-fingerprint:hover {
      background-color: #1e293b;
    }

    .btn-clear {
      background-color: #f1f5f9;
      color: #64748b;
    }

    .btn-clear:hover {
      background-color: #fee2e2;
      color: #ef4444;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-header h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .table-responsive {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: white;
    }

    th {
      background-color: #f8fafc;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #f1f5f9;
      color: var(--text-main);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: #f8fafc;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: white;
      display: inline-block;
    }

    .badge-hadir { background-color: var(--hadir-bg); }
    .badge-telat { background-color: var(--telat-bg); }
    .badge-izin { background-color: var(--izin-bg); }
    .badge-dispensasi { background-color: var(--dispensasi-bg); }
    .badge-sakit { background-color: var(--sakit-bg); }
    .badge-alpa { background-color: var(--alpa-bg); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-title">
      <h2>Presensi Harian</h2>
      <p>Sistem pencatatan kehadiran otomatis</p>
    </div>
    
    <form id="attendanceForm">
      <div class="form-group">
        <label for="noAbsen">Nomor Absen</label>
        <input type="number" id="noAbsen" placeholder="Masukkan nomor absen">
      </div>

      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Otomatis terisi via No. Absen / Fingerprint">
      </div>

      <div class="form-group">
        <label for="status">Keterangan Status</label>
        <select id="status">
          <option value="Hadir">Hadir</option>
          <option value="Izin">Izin</option>
          <option value="Dispensasi">Dispensasi</option>
          <option value="Sakit">Sakit</option>
          <option value="Alpa">Alpa</option>
        </select>
      </div>

      <div class="btn-group">
        <button type="submit" class="btn-submit">Absen Manual</button>
        <button type="button" class="btn-fingerprint" id="btnFingerprint">Fingerprint</button>
        <button type="button" class="btn-clear" id="btnClear">Hapus Data HP</button>
      </div>
    </form>

    <div class="section-header">
      <h3>Riwayat Lokal Perangkat</h3>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Waktu</th>
            <th>No. Absen</th>
            <th>Nama</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="attendanceTable">
          <!-- Data terisi via JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // =========================================================
    // 🔗 URL GOOGLE APPS SCRIPT
    // =========================================================
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzfaxgplEKV0pLg8GuCGYmYn9Hr2IG7U3wHRupbv2TaukunIAdTFt1M3YGaUjtadsuyFg/exec';

    const studentDatabase = {
      "1": "ABDILAH ISMAIL",
      "2": "ABDULLAH AZZAMUL AKRAM",
      "3": "ALDYANSYAH GEMA GUMILAR",
      "4": "ADZANI AHSAN AL FARUQ",
      "5": "ADZRA AQILAH HUSNA",
      "6": "AKHDAN JABBAR RAHADIKA",
      "7": "ALDY RAMADHAN",
      "8": "ALFIN SAMUEL",
      "9": "ALIF AHMAD ALFARABI",
      "10": "ALTHAFUL MUHAMMAD ZIYAD",
      "11": "ALYA NAYSHILLA ZALIANTY",
      "12": "CANDRA MUHAMMAD RIZKI",
      "13": "FABIAN SAKHII HAIDAR",
      "14": "FADIL FADILAH",
      "15": "FAHRI TRI TANDIAN PRAYOGA",
      "16": "HAIDAR SYAFIQ ZAIN",
      "17": "KHANSA PUTRI LATIFAH",
      "18": "KYANDRA HAMZIQ HAMIZAN",
      "19": "MOCHAMAD RIDWANNUDIN",
      "20": "MOHAMAD YUSRA MAHDAN",
      "21": "MUHAMAD RAISA PRAYOGA",
      "22": "MUHAMMAD FINZA SAMIR QOLBI",
      "23": "MUHAMMAD IRFAN",
      "24": "MUHAMMAD NASER SYARIF GOZALI",
      "25": "MUHAMMAD RAHLIL IBRAHIM",
      "26": "MUHAMMAD RAIHAN ARKAN RAHAYU",
      "27": "MUHAMMAD RIZKY NASRUDIN",
      "28": "MU'TASHIM VEDA ARTHAGUNG",
      "29": "NAZHILA ANDHINI",
      "30": "PRIYANKA ARSYA SAFIERA",
      "31": "RADITYA PRATAMA",
      "32": "RAFI SUPRIYADI",
      "33": "RASYA OKTAVIAN AL HABBSYI",
      "34": "REYVAN RIZQI RIVALDI",
      "35": "RIGA HENDRI SUWARA",
      "36": "RIZQI MAULANA",
      "37": "RIZQI MISHARY RASHID",
      "38": "SAFA KHAIRUNISA",
      "39": "SITI NURSYAHIDAH",
      "40": "SYAHRIL AHMAD WIJAYA",
      "41": "VICKY IZAQI ALMUWARIZKI"
    };

    const form = document.getElementById('attendanceForm');
    const inputNoAbsen = document.getElementById('noAbsen');
    const inputNama = document.getElementById('nama');
    const tableBody = document.getElementById('attendanceTable');
    const btnClear = document.getElementById('btnClear');
    const btnFingerprint = document.getElementById('btnFingerprint');

    let attendanceData = JSON.parse(localStorage.getItem('absensiData')) || [];

    inputNoAbsen.addEventListener('input', function() {
      const val = this.value.trim();
      if (studentDatabase[val]) {
        inputNama.value = studentDatabase[val];
      } else {
        inputNama.value = '';
      }
    });

    function renderTable() {
      tableBody.innerHTML = '';

      if (attendanceData.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8; padding: 24px;">Belum ada riwayat absensi lokal.</td></tr>`;
        return;
      }

      attendanceData.forEach((item, index) => {
        const row = document.createElement('tr');
        
        let badgeClass = 'badge-hadir';
        if (item.status.includes('Telat')) badgeClass = 'badge-telat';
        if (item.status.includes('Izin')) badgeClass = 'badge-izin';
        if (item.status.includes('Dispensasi')) badgeClass = 'badge-dispensasi';
        if (item.status.includes('Sakit')) badgeClass = 'badge-sakit';
        if (item.status.includes('Alpa')) badgeClass = 'badge-alpa';

        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${item.waktu}</td>
          <td><b>${item.noAbsen}</b></td>
          <td>${item.nama}</td>
          <td><span class="badge ${badgeClass}">${item.status}</span></td>
        `;
        tableBody.appendChild(row);
      });
    }

    async function simpanAbsen(noAbsen, nama, statusPilihan) {
      const now = new Date();
      const waktuFormat = now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID');

      let statusAkhir = statusPilihan;

      if (statusPilihan === 'Hadir') {
        const jam = now.getHours();
        const menit = now.getMinutes();

        if (jam > 6 || (jam === 6 && menit > 30)) {
          statusAkhir = 'Telat';
        }
      }

      const newRecord = { waktu: waktuFormat, noAbsen, nama, status: statusAkhir };
      
      // 1. Simpan di LocalStorage HP
      attendanceData.push(newRecord);
      localStorage.setItem('absensiData', JSON.stringify(attendanceData));
      renderTable();
      form.reset();

      // 2. Kirim Data ke Google Sheets
      if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.startsWith('https://script.google.com/')) {
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newRecord)
          });
        } catch (err) {
          console.error('Gagal mengirim ke Google Sheets:', err);
        }
      }
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const noAbsen = inputNoAbsen.value.trim();
      const nama = inputNama.value.trim();
      const status = document.getElementById('status').value;

      if (!noAbsen || !nama) {
        alert('Isi Nomor Absen dan Nama terlebih dahulu!');
        return;
      }

      simpanAbsen(noAbsen, nama, status);
    });

    btnFingerprint.addEventListener('click', async function() {
      const status = document.getElementById('status').value;
      let noAbsen = inputNoAbsen.value.trim();
      let nama = inputNama.value.trim();

      if (!window.PublicKeyCredential) {
        alert('Browser/Perangkat tidak mendukung Fingerprint!');
        return;
      }

      const savedUser = JSON.parse(localStorage.getItem('fingerprintUser'));

      if (savedUser) {
        try {
          const assertion = await navigator.credentials.get({
            publicKey: {
              challenge: new Uint8Array([1, 2, 3, 4]),
              timeout: 60000,
              userVerification: "required"
            }
          });

          if (assertion) {
            simpanAbsen(savedUser.noAbsen, savedUser.nama, status);
            alert(`Absensi Berhasil! Terdeteksi sebagai: ${savedUser.nama}`);
          }
        } catch (err) {
          alert('Autentikasi fingerprint dibatalkan atau tidak cocok.');
        }
      } else {
        if (!noAbsen || !nama) {
          alert('Untuk pendaftaran awal, isi Nomor Absen dan Nama terlebih dahulu!');
          return;
        }

        try {
          const credential = await navigator.credentials.create({
            publicKey: {
              challenge: new Uint8Array([1, 2, 3, 4]),
              rp: { name: "Aplikasi Absensi" },
              user: { id: new Uint8Array([1, 2, 3, 4]), name: nama, displayName: nama },
              pubKeyCredParams: [{ type: "public-key", alg: -7 }],
              timeout: 60000,
              authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }
            }
          });

          if (credential) {
            localStorage.setItem('fingerprintUser', JSON.stringify({ noAbsen, nama }));
            simpanAbsen(noAbsen, nama, status);
            alert(`Pendaftaran Fingerprint Berhasil!`);
          }
        } catch (err) {
          alert('Pendaftaran fingerprint dibatalkan/gagal.');
        }
      }
    });

    btnClear.addEventListener('click', function() {
      if (attendanceData.length === 0) return;
      if (confirm('Hapus riwayat lokal di HP ini?')) {
        attendanceData = [];
        localStorage.removeItem('absensiData');
        localStorage.removeItem('fingerprintUser');
        renderTable();
      }
    });

    renderTable();
  </script>
</body>
</html>
